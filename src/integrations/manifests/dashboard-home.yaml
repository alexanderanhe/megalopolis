apiVersion: dashboard.integrations/v1alpha1
kind: WidgetIntegration
metadata:
  id: dashboard.home
  name: Dashboard Home
  slug: dashboard-home
  version: 1.0.0
  category: dashboard
  subcategory: home
  description: Agrega la data de clima y Hoy No Circula en un solo endpoint.
  icon: dashboard
  tags:
    - dashboard
    - home
    - megalopolis
  provider:
    name: Megalopolis API
    website: https://megalopolis.angu.dev
    documentation: https://megalopolis.angu.dev/docs
  author:
    name: Internal
  visibility: private
  status: active
  locale: es-MX
source:
  type: rest
  protocol: https
  baseUrl: ${API_BASE_URL}
  path: /dashboard/home
  method: GET
  contentType: application/json
  accept: application/json
  timeoutMs: 8000
  pagination:
    enabled: false
    type: none
  rateLimitHint:
    requests: 60
    per: minute
auth:
  type: none
  required: false
  fields: []
  notes: []
config:
  fields: []
input:
  pathParams: []
  queryParams: []
  headers: []
  body:
    enabled: false
    contentType: application/json
    template: {}
refresh:
  enabled: true
  mode: polling
  userConfigurable: true
  allowedIntervals:
    - 5m
    - 10m
    - 15m
    - 30m
    - 1h
  defaultInterval: 10m
  minInterval: 5m
  maxInterval: 1h
  immediateOnLoad: true
  manualRefresh: true
  refreshOnFocus: false
  dedupeWindowSeconds: 30
  maxRefreshPerHour: 12
  cron: null
cache:
  enabled: true
  strategy: ttl
  ttl:
    value: 10
    unit: minutes
  staleWhileRevalidate: true
  staleTtl:
    value: 5
    unit: minutes
  scope: user
  keyTemplate: "integration:{metadata.id}"
sse:
  enabled: true
  frontendPushEnabled: true
  eventName: widget:update
  channel: widget
  broadcastScope: user
  emitOnlyOnChange: true
  heartbeatSeconds: 25
output:
  format: object
  primaryFields:
    - updatedAt
    - hoyNoCircula
    - weather
  schema:
    type: object
    properties:
      success:
        type: boolean
      updatedAt:
        type: string
        format: date-time
      data:
        type: object
        properties:
          hoyNoCircula:
            type: object
            properties:
              date:
                type: string
              scope:
                type: array
                items:
                  type: string
              restrictionStart:
                type: string
              restrictionEnd:
                type: string
              restrictions:
                type: object
                properties:
                  color:
                    type: string
                  plateEndings:
                    type: array
                    items:
                      type: number
                  holograms:
                    type: array
                    items:
                      type: string
              exemptions:
                type: array
                items:
                  type: string
          weather:
            type: object
            properties:
              city:
                type: string
              temperatureC:
                type: number
              humidity:
                type: number
              condition:
                type: string
              windKph:
                type: number
        required:
          - hoyNoCircula
          - weather
    required:
      - success
      - updatedAt
      - data
  normalization:
    enabled: false
ui:
  widget:
    type: composite
    title: Dashboard Home
    subtitle: Resumen diario
    emptyState: Sin datos
    loadingState: Cargando resumen...
    errorState: Error al cargar el resumen
    defaultSize:
      w: 6
      h: 3
    minSize:
      w: 4
      h: 3
    maxSize:
      w: 8
      h: 4
    resizable: true
    movable: true
    liveBadge: true
  presentation:
    icon: dashboard
    color: slate
    preferredLayout: wide
policies:
  allowManualRefresh: true
  allowMultipleInstances: true
  requiresAuthToInstall: false
  requiresAuthToRun: false
  exposeErrorsToUser: false
  redactSensitiveFields: true
  storeSecretsSeparately: true
  allowClientSideExecution: false
observability:
  enabled: true
  logLevel: standard
  metrics:
    trackLatency: true
    trackErrors: true
    trackCacheHits: true
    trackRefreshCount: true
  healthcheck:
    enabled: true
    timeoutMs: 3000
docs:
  summary: Returns aggregated data for the dashboard home view.
  setupInstructions: []
  notes: []
  changelog:
    - version: 1.0.0
      description: Initial manifest version for dashboard home.
examples:
  config: {}
  auth: {}
  expectedResponse:
    success: true
    updatedAt: "2026-03-18T12:00:00.000Z"
    data:
      hoyNoCircula:
        date: "2026-03-18"
        scope:
          - cdmx
          - edomex
        restrictionStart: "05:00"
        restrictionEnd: "22:00"
        restrictions:
          color: amarillo
          plateEndings:
            - 5
            - 6
          holograms:
            - "1"
            - "2"
        exemptions:
          - electrico
          - hibrido
      weather:
        city: cdmx
        temperatureC: 22
        humidity: 55
        condition: clear
        windKph: 10
