apiVersion: dashboard.integrations/v1alpha1
kind: WidgetIntegration
metadata:
  id: widget.generic.dashboard
  name: Generic Dashboard Widget
  slug: generic-dashboard-widget
  version: 1.0.0
  category: utilities
  subcategory: aggregation
  description: Generic, reusable widget integration manifest for any API source
  icon: puzzle
  tags:
    - generic
    - dashboard
    - widget
    - integration
  provider:
    name: Generic Provider
    website: https://example.com
    documentation: https://example.com/docs
  author:
    name: Dashboard Team
  visibility: public
  status: active
  locale: en-US
source:
  type: http
  protocol: https
  baseUrl: https://api.example.com
  path: /v1/resource
  method: GET
  contentType: application/json
  accept: application/json
  timeoutMs: 8000
  pagination:
    type: none
    pageParam: page
    pageSizeParam: limit
    maxPages: 1
  rateLimitHint:
    requests: 60
    per: minute
auth:
  type: apiKey
  required: false
  fields:
    - key: apiKey
      label: API Key
      description: API key provided by the data source
      placement: header
      headerName: X-API-Key
      queryName: api_key
      format: string
      required: false
      secret: true
      masked: true
config:
  - key: title
    label: Widget Title
    description: Title displayed on the widget
    type: string
    required: false
    default: Generic Widget
    minLength: 1
    maxLength: 50
    placeholder: Enter a title
    ui:
      width: half
  - key: locale
    label: Locale
    description: Locale used for formatting
    type: string
    required: false
    default: en-US
    options:
      - en-US
      - es-MX
    ui:
      width: half
input:
  pathParams:
    - key: resourceId
      source: config
      required: false
      pathName: id
  queryParams:
    - key: q
      source: user
      required: false
      queryName: q
    - key: limit
      source: config
      required: false
      queryName: limit
  headers:
    - key: acceptLanguage
      source: config
      required: false
      headerName: Accept-Language
  body:
    enabled: false
    contentType: application/json
    template: {}
refresh:
  enabled: true
  mode: interval
  userConfigurable: true
  allowedIntervals:
    - 1m
    - 5m
    - 10m
    - 15m
    - 30m
    - 1h
  defaultInterval: 10m
  minInterval: 1m
  maxInterval: 1h
  immediateOnLoad: true
  manualRefresh: true
  refreshOnFocus: false
  dedupeWindowSeconds: 30
  maxRefreshPerHour: 120
  cron: ""
cache:
  enabled: true
  strategy: memory
  ttl:
    value: 10
    unit: minutes
  staleWhileRevalidate: true
  staleTtl:
    value: 30
    unit: minutes
  scope: per-user
  keyTemplate: widget:generic:{userId}:{configHash}:{inputHash}
sse:
  enabled: false
  frontendPushEnabled: false
  eventName: widget.update
  channel: widgets.generic
  broadcastScope: tenant
  emitOnlyOnChange: true
  heartbeatSeconds: 30
output:
  format: json
  primaryFields:
    - title
    - value
    - unit
  schema:
    type: object
    properties:
      title:
        type: string
      value:
        type: number
      unit:
        type: string
      updatedAt:
        type: string
        format: date-time
  normalization:
    strategy: map
    mapping:
      title: $.data.title
      value: $.data.value
      unit: $.data.unit
      updatedAt: $.meta.updatedAt
ui:
  widget:
    type: stat
    title: Generic Widget
    subtitle: Live metric
    emptyState: No data available
    loadingState: Loading data...
    errorState: Failed to load data
    defaultSize:
      w: 2
      h: 2
    minSize:
      w: 1
      h: 1
    maxSize:
      w: 4
      h: 3
    resizable: true
    movable: true
    liveBadge: false
  presentation:
    icon: puzzle
    color: slate
    preferredLayout: grid
policies:
  allowManualRefresh: true
  allowMultipleInstances: true
  requiresAuthToInstall: false
  requiresAuthToRun: false
  exposeErrorsToUser: true
  redactSensitiveFields: true
  storeSecretsSeparately: true
  allowClientSideExecution: false
observability:
  enabled: true
  logLevel: info
  metrics:
    trackLatency: true
    trackErrors: true
    trackCacheHits: true
    trackRefreshCount: true
  healthcheck:
    enabled: true
    timeoutMs: 2000
docs:
  summary: Generic widget integration manifest usable for any API source
  setupInstructions:
    - Add this manifest to your dashboard registry
    - Configure auth fields if the provider requires it
    - Set refresh and cache policy as desired
  notes:
    - This manifest does not include real credentials
    - Adjust normalization mapping to match provider output
  changelog:
    - version: 1.0.0
      date: 2026-03-18
      changes:
        - Initial manifest
examples:
  config:
    title: Example Metric
    locale: en-US
  auth:
    apiKey: REDACTED
  expectedResponse:
    title: Example Metric
    value: 42
    unit: ms
    updatedAt: 2026-03-18T12:00:00.000Z
