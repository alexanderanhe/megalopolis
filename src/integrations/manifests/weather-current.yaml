apiVersion: dashboard.integrations/v1alpha1
kind: WidgetIntegration
metadata:
  id: weather.current
  name: Weather Current
  slug: weather-current
  version: 1.0.1
  category: weather
  subcategory: current
  description: Clima actual por ciudad.
  icon: cloud
  tags:
    - weather
    - current
    - megalopolis
  provider:
    name: Megalopolis API
    website: https://megalopolis.angu.dev
    documentation: https://megalopolis.angu.dev/docs
  author:
    name: Internal
  visibility: private
  status: active
  locale: es-MX
source:
  type: rest
  protocol: https
  baseUrl: ${API_BASE_URL}
  path: /weather/current
  method: GET
  contentType: application/json
  accept: application/json
  timeoutMs: 8000
  pagination:
    enabled: false
    type: none
  rateLimitHint:
    requests: 60
    per: minute
auth:
  type: none
  required: false
  fields: []
  notes: []
config:
  fields: []
input:
  pathParams: []
  queryParams:
    - key: city
      source: static
      required: true
      queryName: city
      value: cdmx
  headers: []
  body:
    enabled: false
    contentType: application/json
    template: {}
refresh:
  enabled: true
  mode: polling
  userConfigurable: true
  allowedIntervals:
    - 5m
    - 10m
    - 15m
    - 30m
    - 1h
  defaultInterval: 10m
  minInterval: 5m
  maxInterval: 1h
  immediateOnLoad: true
  manualRefresh: true
  refreshOnFocus: false
  dedupeWindowSeconds: 30
  maxRefreshPerHour: 12
  cron: null
cache:
  enabled: true
  strategy: ttl
  ttl:
    value: 10
    unit: minutes
  staleWhileRevalidate: true
  staleTtl:
    value: 5
    unit: minutes
  scope: user
  keyTemplate: "integration:{metadata.id}:city:cdmx"
sse:
  enabled: true
  frontendPushEnabled: true
  eventName: widget:update
  channel: widget
  broadcastScope: user
  emitOnlyOnChange: true
  heartbeatSeconds: 25
output:
  format: object
  primaryFields:
    - city
    - temperatureC
    - condition
    - computed.temperatureLabel
    - computed.humidityLabel
    - computed.windLabel
  schema:
    type: object
    properties:
      success:
        type: boolean
      updatedAt:
        type: string
        format: date-time
      data:
        type: object
        properties:
          city:
            type: string
          temperatureC:
            type: number
          humidity:
            type: number
          condition:
            type: string
          windKph:
            type: number
        required:
          - city
          - temperatureC
          - humidity
          - condition
          - windKph
      computed:
        type: object
        properties:
          temperatureLabel:
            type: string
          humidityLabel:
            type: string
          windLabel:
            type: string
        required:
          - temperatureLabel
          - humidityLabel
          - windLabel
    required:
      - success
      - updatedAt
      - data
      - computed
  normalization:
    enabled: false
ui:
  widget:
    type: status-card
    title: Clima actual
    subtitle: Temperatura y condiciones
    emptyState: Sin datos
    loadingState: Cargando clima...
    errorState: Error al cargar el clima
    defaultSize:
      w: 3
      h: 2
    minSize:
      w: 2
      h: 2
    maxSize:
      w: 5
      h: 3
    resizable: true
    movable: true
    liveBadge: true
  presentation:
    icon: cloud
    color: blue
    preferredLayout: compact
  layout:
    variant: status-card
    density: compact
    sections:
      - id: header
        type: inline
        fields:
          - title
          - updatedAt
      - id: primaryStatus
        type: stack
        fields:
          - temperatureLabel
          - conditionLabel
          - humidityLabel
      - id: footer
        type: actions
        fields:
          - refresh
  bindings:
    title:
      source: static
      value: Clima actual
    updatedAt:
      source: data.updatedAt
      formatter: timeShortEsMx
    temperatureLabel:
      source: computed.temperatureLabel
    conditionLabel:
      source: data.data.condition
    humidityLabel:
      source: computed.humidityLabel
  actions:
    refresh:
      type: refresh
      label: Actualizar
      icon: refresh-cw
  states:
    ok:
      tone: success
      accentColor: blue
      icon: sun
    warning:
      tone: warning
      accentColor: amber
      icon: cloud-drizzle
    error:
      tone: danger
      accentColor: red
      icon: alert-circle
policies:
  allowManualRefresh: true
  allowMultipleInstances: true
  requiresAuthToInstall: false
  requiresAuthToRun: false
  exposeErrorsToUser: false
  redactSensitiveFields: true
  storeSecretsSeparately: true
  allowClientSideExecution: false
observability:
  enabled: true
  logLevel: standard
  metrics:
    trackLatency: true
    trackErrors: true
    trackCacheHits: true
    trackRefreshCount: true
  healthcheck:
    enabled: true
    timeoutMs: 3000
docs:
  summary: Returns current weather data for the requested city.
  setupInstructions: []
  notes: []
  changelog:
    - version: 1.0.0
      description: Initial manifest version for current weather.
    - version: 1.0.1
      description: Provide a default city query param to avoid validation errors.
examples:
  config: {}
  auth: {}
  expectedResponse:
    success: true
    updatedAt: "2026-03-18T12:00:00.000Z"
    data:
      city: cdmx
      temperatureC: 22
      humidity: 55
      condition: clear
      windKph: 10
    computed:
      temperatureLabel: "22°C"
      humidityLabel: "55% humedad"
      windLabel: "10 km/h"
