apiVersion: dashboard.integrations/v1alpha1
kind: WidgetIntegration
metadata:
  id: system.health.check
  name: API Health
  slug: health
  version: 1.0.0
  category: system
  subcategory: health
  description: Verifica que la API de Megalopolis este en linea.
  icon: activity
  tags:
    - health
    - status
    - megalopolis
  provider:
    name: Megalopolis API
    website: https://megalopolis.angu.dev
    documentation: https://megalopolis.angu.dev/docs
  author:
    name: Internal
  visibility: private
  status: active
  locale: es-MX
source:
  type: rest
  protocol: https
  baseUrl: ${API_BASE_URL}
  path: /health
  method: GET
  contentType: application/json
  accept: application/json
  timeoutMs: 3000
  pagination:
    enabled: false
    type: none
  rateLimitHint:
    requests: 120
    per: minute
auth:
  type: none
  required: false
  fields: []
  notes: []
config:
  fields: []
input:
  pathParams: []
  queryParams: []
  headers: []
  body:
    enabled: false
    contentType: application/json
    template: {}
refresh:
  enabled: true
  mode: polling
  userConfigurable: true
  allowedIntervals:
    - 1m
    - 5m
    - 10m
    - 15m
  defaultInterval: 5m
  minInterval: 1m
  maxInterval: 15m
  immediateOnLoad: true
  manualRefresh: true
  refreshOnFocus: true
  dedupeWindowSeconds: 10
  maxRefreshPerHour: 120
  cron: null
cache:
  enabled: true
  strategy: ttl
  ttl:
    value: 1
    unit: minutes
  staleWhileRevalidate: false
  staleTtl:
    value: 0
    unit: minutes
  scope: user
  keyTemplate: "integration:{metadata.id}"
sse:
  enabled: false
  frontendPushEnabled: false
  eventName: widget:update
  channel: widget
  broadcastScope: user
  emitOnlyOnChange: true
  heartbeatSeconds: 25
output:
  format: object
  primaryFields:
    - success
    - message
  schema:
    type: object
    properties:
      success:
        type: boolean
      message:
        type: string
    required:
      - success
      - message
  normalization:
    enabled: false
ui:
  widget:
    type: status-card
    title: API Health
    subtitle: Estado de la API
    emptyState: Sin datos
    loadingState: Verificando...
    errorState: Error de salud
    defaultSize:
      w: 3
      h: 2
    minSize:
      w: 2
      h: 2
    maxSize:
      w: 4
      h: 2
    resizable: true
    movable: true
    liveBadge: true
  presentation:
    icon: activity
    color: green
    preferredLayout: compact
  layout:
    variant: status-card
    density: compact
    sections:
      - id: header
        type: inline
        fields:
          - title
      - id: primaryStatus
        type: stack
        fields:
          - statusLabel
          - message
      - id: footer
        type: actions
        fields:
          - refresh
  bindings:
    title:
      source: static
      value: API Health
    statusLabel:
      source: computed.statusLabel
    message:
      source: data.message
  actions:
    refresh:
      type: refresh
      label: Actualizar
      icon: refresh-cw
  states:
    ok:
      tone: success
      accentColor: green
      icon: check-circle
    error:
      tone: danger
      accentColor: red
      icon: alert-circle
policies:
  allowManualRefresh: true
  allowMultipleInstances: true
  requiresAuthToInstall: false
  requiresAuthToRun: false
  exposeErrorsToUser: true
  redactSensitiveFields: true
  storeSecretsSeparately: true
  allowClientSideExecution: false
observability:
  enabled: true
  logLevel: standard
  metrics:
    trackLatency: true
    trackErrors: true
    trackCacheHits: true
    trackRefreshCount: true
  healthcheck:
    enabled: true
    timeoutMs: 2000
docs:
  summary: Returns a health status message for the API.
  setupInstructions: []
  notes: []
  changelog:
    - version: 1.0.0
      description: Initial manifest version for health.
examples:
  config: {}
  auth: {}
  expectedResponse:
    success: true
    message: API is running
    computed:
      statusLabel: OK
