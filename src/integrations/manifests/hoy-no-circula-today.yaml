apiVersion: dashboard.integrations/v1alpha1
kind: WidgetIntegration

metadata:
  id: mobility.hoy-no-circula.today
  name: Hoy No Circula Today
  slug: hoy-no-circula-today
  version: 1.0.0
  category: mobility
  subcategory: restrictions
  description: Muestra las restricciones vehiculares del día para Hoy No Circula en CDMX y EDOMEX.
  icon: car-off
  tags:
    - hoy-no-circula
    - mobility
    - cdmx
    - edomex
    - restrictions
  provider:
    name: Megalopolis API
    website: https://megalopolis.angu.dev
    documentation: https://megalopolis.angu.dev/docs
  author:
    name: Internal
  visibility: private
  status: active
  locale: es-MX

source:
  type: rest
  protocol: https
  baseUrl: ${API_BASE_URL}
  path: /hoy-no-circula/today
  method: GET
  contentType: application/json
  accept: application/json
  timeoutMs: 8000
  pagination:
    enabled: false
    type: none
  rateLimitHint:
    requests: 60
    per: minute

auth:
  type: none
  required: false
  fields: []
  notes: []

config:
  fields: []

input:
  pathParams: []
  queryParams: []
  headers: []
  body:
    enabled: false
    contentType: application/json
    template: {}

refresh:
  enabled: true
  mode: polling
  userConfigurable: true
  allowedIntervals:
    - 5m
    - 10m
    - 15m
    - 30m
    - 1h
  defaultInterval: 10m
  minInterval: 5m
  maxInterval: 1h
  immediateOnLoad: true
  manualRefresh: true
  refreshOnFocus: false
  dedupeWindowSeconds: 30
  maxRefreshPerHour: 12
  cron: null

cache:
  enabled: true
  strategy: ttl
  ttl:
    value: 10
    unit: minutes
  staleWhileRevalidate: true
  staleTtl:
    value: 5
    unit: minutes
  scope: user
  keyTemplate: "integration:{metadata.id}"

sse:
  enabled: true
  frontendPushEnabled: true
  eventName: widget:update
  channel: widget
  broadcastScope: user
  emitOnlyOnChange: true
  heartbeatSeconds: 25

output:
  format: object
  primaryFields:
    - updatedAt
    - data.date
    - data.restrictions.color
    - data.restrictions.plateEndings
    - data.restrictions.holograms
    - data.restrictionStart
    - data.restrictionEnd
    - computed.formattedDate
    - computed.restrictionSummary
    - computed.hologramSummary
    - computed.restrictionHours
    - widgetStatus
  schema:
    type: object
    properties:
      success:
        type: boolean
      updatedAt:
        type: string
        format: date-time
      data:
        type: object
        properties:
          date:
            type: string
          scope:
            type: array
            items:
              type: string
          restrictionStart:
            type: string
          restrictionEnd:
            type: string
          restrictions:
            type: object
            properties:
              color:
                type: string
              plateEndings:
                type: array
                items:
                  type: number
              holograms:
                type: array
                items:
                  type: string
            required:
              - color
              - plateEndings
              - holograms
          exemptions:
            type: array
            items:
              type: string
        required:
          - date
          - scope
          - restrictionStart
          - restrictionEnd
          - restrictions
      computed:
        type: object
        properties:
          formattedDate:
            type: string
          restrictionSummary:
            type: string
          hologramSummary:
            type: string
          restrictionHours:
            type: string
        required:
          - formattedDate
          - restrictionSummary
          - hologramSummary
          - restrictionHours
      widgetStatus:
        type: string
    required:
      - success
      - updatedAt
      - data
      - computed
      - widgetStatus
  normalization:
    enabled: false
    strategy: none

ui:
  widget:
    type: status-card
    title: Hoy No Circula
    subtitle: Restricciones vehiculares de hoy
    emptyState: No hay información disponible.
    loadingState: Cargando restricciones...
    errorState: No fue posible cargar la información.
    defaultSize:
      w: 4
      h: 2
    minSize:
      w: 3
      h: 2
    maxSize:
      w: 6
      h: 4
    resizable: true
    movable: true
    liveBadge: true

  presentation:
    icon: car-off
    color: amber
    preferredLayout: compact

  layout:
    variant: restriction-status-card
    density: compact
    sections:
      - id: header
        type: stack
        fields:
          - title
          - formattedDate

      - id: primaryStatus
        type: stack
        fields:
          - restrictionColor
          - plateEndings
          - holograms

      - id: schedule
        type: inline
        fields:
          - restrictionHours

      - id: footer
        type: actions
        fields:
          - details
          - refresh

  bindings:
    title:
      source: static
      value: Hoy No Circula

    formattedDate:
      source: data.computed.formattedDate

    restrictionColor:
      source: data.data.restrictions.color
      label: Engomado

    plateEndings:
      source: data.data.restrictions.plateEndings
      label: Terminación

    holograms:
      source: data.data.restrictions.holograms
      label: Holograma

    restrictionHours:
      source: data.computed.restrictionHours
      label: Horario

  actions:
    details:
      type: modal
      label: Ver detalles
      target: widget-details

    refresh:
      type: refresh
      label: Actualizar
      icon: refresh-cw

  states:
    ok:
      tone: success
      accentColor: green
      icon: check-circle

    restricted:
      tone: danger
      accentColor: red
      icon: ban

    warning:
      tone: warning
      accentColor: amber
      icon: alert-triangle

    error:
      tone: danger
      accentColor: red
      icon: alert-circle

policies:
  allowManualRefresh: true
  allowMultipleInstances: true
  requiresAuthToInstall: false
  requiresAuthToRun: false
  exposeErrorsToUser: false
  redactSensitiveFields: true
  storeSecretsSeparately: true
  allowClientSideExecution: false

observability:
  enabled: true
  logLevel: standard
  metrics:
    trackLatency: true
    trackErrors: true
    trackCacheHits: true
    trackRefreshCount: true
  healthcheck:
    enabled: true
    timeoutMs: 3000

docs:
  summary: Returns today's Hoy No Circula restrictions for CDMX and EDOMEX.
  setupInstructions: []
  notes:
    - This manifest includes computed fields for normalized responses.
  changelog:
    - version: 1.0.1
      description: Adjusted bindings and UI structure to match the current API response shape.

examples:
  config: {}
  auth: {}
  expectedResponse:
    success: true
    updatedAt: "2026-03-19T22:30:00.513Z"
    data:
      date: "2026-03-19"
      scope:
        - CDMX
        - EDOMEX
      restrictionStart: "05:00"
      restrictionEnd: "22:00"
      restrictions:
        color: rojo
        plateEndings:
          - 3
          - 4
        holograms:
          - "1"
          - "2"
      exemptions:
        - "00"
        - "0"
        - eléctricos
        - híbridos
    computed:
      formattedDate: "Viernes · 19 Mar"
      restrictionSummary: "Rojo · 3 y 4"
      hologramSummary: "Holograma 1 y 2"
      restrictionHours: "05:00 — 22:00"
    widgetStatus: restricted
